name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify bundled database matches the Room schema
        run: |
          python3 tools/verify_room_schema.py \
            app/schemas/com.sanix.mhgucodex.data.local.MhguDatabase/2.json \
            app/src/main/assets/databases/mhgu_codex.db.gz

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhgu-codex-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint and test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            app/schemas/**
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7
