name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify bundled database matches the Room schema
        run: |
          python3 tools/verify_room_schema.py \
            app/schemas/com.sanix.mhgucodex.data.local.MhguDatabase/2.json \
            app/src/main/assets/databases/mhgu_codex.db.gz

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mhgu-codex-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint and test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            app/schemas/**
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

  smoke:
    name: Launch on emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: mhgu-codex-debug-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and check for crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell am start -W -n com.sanix.mhgucodex/.MainActivity
            sleep 20
            adb logcat -d > logcat.txt
            echo "---- crash log ----"
            grep -A60 "FATAL EXCEPTION\|AndroidRuntime" logcat.txt || true
            echo "---- room / app ----"
            grep -i "room\|sqlite\|mhgucodex" logcat.txt | tail -60 || true
            adb shell pidof com.sanix.mhgucodex || (echo "App is not running: it crashed on launch" && exit 1)
            ! grep -q "FATAL EXCEPTION" logcat.txt

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logcat
          path: logcat.txt
          if-no-files-found: warn
          retention-days: 7
